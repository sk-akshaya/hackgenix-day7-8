<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Student Marks Dashboard</h1>
    <button id="all">All</button>
    <button id="passed">Passed</button>
    <button id="sort">Sort by total</button>
    <table id="board" border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Marks</th>
                <th>Total</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>
    <pre id="json"></pre>
    <h2>JSON Data</h2>
    <textarea id="jsonInput" placeholder="Paste your JSON here"></textarea>
    <button id="parseBtn">Parse JSON</button>
    <p id="message"></p>
    <pre id="parsedData"></pre>
    <script src="script.js"></script>
</body>
</html>
